  cookies_policy:
    page_title: "Cookie-Richtlinie - CutList"
    title: "Cookie-Richtlinie"
    last_updated: "Zuletzt aktualisiert: 16. Februar 2026"
    intro: "Willkommen zur CutList Cookie-Richtlinie. Diese Richtlinie erklärt, wie Noventi SARL (\"Noventi\", \"wir\", \"uns\" oder \"unser\") Cookies und ähnliche Technologien verwendet, wenn du unsere Website cutoptima.com und verwandte Dienste (zusammen die \"Website\") besuchst oder nutzt."
    link: "Cookie-Richtlinie"
    what_are_cookies:
      title: "Was sind Cookies?"
      body: "Cookies sind kleine Textdateien, die beim Besuch einer Website in deinem Browser oder auf deinem Gerät gespeichert werden. Sie helfen der Website, dein Gerät zu erkennen und bestimmte Informationen über deinen Besuch zu speichern, wie deine Einstellungen, deinen Anmeldestatus oder wie du die Website nutzt. Zusätzlich zu Cookies können wir ähnliche Technologien wie Web-Beacons, lokalen Speicher und Sitzungsspeicher verwenden. Der Einfachheit halber bezeichnen wir all diese Technologien in dieser Richtlinie zusammenfassend als \"Cookies\"."
    how_we_use:
      title: "Wie wir Cookies verwenden"
      body: "Wir verwenden Cookies für verschiedene Zwecke: um die Website sicher und funktionsfähig zu halten, um deine Einstellungen zu speichern, um zu verstehen, wie du die Website nutzt, und um deine Gesamterfahrung zu verbessern. Cookies helfen uns festzustellen, ob du die Website bereits besucht hast, ermöglichen es dir, angemeldet zu bleiben, und lassen uns den Dienst an deine Bedürfnisse anpassen."
    types:
      title: "Arten von Cookies, die wir verwenden"
      essential:
        title: "Wesentliche Cookies"
        body: "Diese Cookies sind für die ordnungsgemäße Funktion der Website unbedingt erforderlich. Ohne sie würden Kernfunktionen wie Benutzerauthentifizierung, Sitzungsverwaltung und Sicherheitsschutz nicht funktionieren. Da diese Cookies für den Betrieb der Website unerlässlich sind, können sie nicht deaktiviert werden."
        session: "Hält deine Benutzersitzung und deinen Anmeldestatus aufrecht"
        remember: "Hält dich angemeldet, wenn du \"Angemeldet bleiben\" auswählst"
        csrf: "Schützt vor Cross-Site-Request-Forgery-Angriffen"
        consent: "Speichert deine Cookie-Einstellungen"
      functionality:
        title: "Funktions-Cookies"
        body: "Funktions-Cookies ermöglichen es uns, die von dir auf der Website getroffenen Entscheidungen zu speichern, wie deine Spracheinstellung oder Oberflächeneinstellungen. Sie verbessern die Benutzerfreundlichkeit durch Personalisierung deiner Erfahrung."
        locale: "Merkt sich deine Spracheinstellung"
        cut_direction: "Speichert deine bevorzugte Schnittrichtungseinstellung"
      analytics:
        title: "Leistungs- & Analyse-Cookies"
        body: "Leistungs-Cookies sammeln aggregierte, anonymisierte Informationen darüber, wie Besucher die Website nutzen, z. B. welche Seiten am häufigsten besucht werden. Wir verwenden diese Informationen, um die Funktionsweise der Website zu verbessern."
        ga: "Unterscheidet eindeutige Benutzer durch Zuweisung einer zufällig generierten Kennung"
        gid: "Unterscheidet Benutzer für Analysezwecke"
      third_party:
        title: "Drittanbieter- & Zahlungs-Cookies"
        body: "Wenn du mit bestimmten Funktionen der Website interagierst, können Drittanbieter eigene Cookies setzen. Unser Zahlungsdienstleister Stripe kann Cookies setzen, wenn du auf zahlungsbezogene Seiten zugreifst. Wir verwenden auch Google OAuth zur Authentifizierung."
        stripe_mid: "Betrugsprävention und Zahlungsabwicklung"
        stripe_sid: "Betrugsprävention und Zahlungssitzungsverwaltung"
    table:
      cookie: "Cookie"
      provider: "Anbieter"
      purpose: "Zweck"
      duration: "Dauer"
    duration:
      session: "1 Tag"
      two_weeks: "2 Wochen"
      one_year: "1 Jahr"
      two_years: "2 Jahre"
      twenty_four_hours: "24 Stunden"
      thirty_minutes: "30 Minuten"
    your_choices:
      title: "Deine Cookie-Wahlmöglichkeiten"
      body: "Wenn du unsere Website zum ersten Mal besuchst, siehst du ein Cookie-Zustimmungsbanner, das dir ermöglicht, nicht wesentliche Cookies zu akzeptieren oder abzulehnen. Die meisten Webbrowser ermöglichen es dir auch, Cookies über ihre Einstellungen zu kontrollieren. Bitte beachte, dass das Blockieren oder Löschen bestimmter Cookies die Funktionalität der Website beeinträchtigen kann. Wesentliche Cookies können nicht deaktiviert werden."
    gdpr:
      title: "Cookies und die DSGVO"
      body: "Als in Frankreich (Nantes) ansässiges Unternehmen halten wir die Europäische Datenschutz-Grundverordnung (DSGVO) und die ePrivacy-Richtlinie in ihrer in französisches Recht umgesetzten Form sowie die Leitlinien der CNIL ein. Wesentliche Cookies werden ohne vorherige Zustimmung gesetzt, da sie unbedingt erforderlich sind. Nicht wesentliche Cookies werden erst gesetzt, nachdem du deine informierte Zustimmung gegeben hast. Du kannst deine Zustimmung jederzeit widerrufen. Wir verwenden keine Cookies für Werbe- oder Profilierungszwecke."
    how_long:
      title: "Wie lange bleiben Cookies auf meinem Gerät?"
      body: "Sitzungs-Cookies sind vorübergehend und werden gelöscht, wenn du deinen Browser schließt. Persistente Cookies bleiben für einen festgelegten Zeitraum auf deinem Gerät oder bis du sie manuell löschst. Die Dauer jedes Cookies ist in den obigen Tabellen angegeben."
    advertising:
      title: "Verwenden wir Cookies für Werbung?"
      body: "Nein. CutList verwendet keine Werbe-Cookies und zeigt keine Drittanzeigen auf der Website an. Wir betreiben kein verhaltensbasiertes Advertising oder seitenübergreifendes Tracking für Marketingzwecke."
    updates:
      title: "Aktualisierungen dieser Richtlinie"
      body: "Wir können diese Cookie-Richtlinie von Zeit zu Zeit aktualisieren, um Änderungen in unseren Praktiken, Technologien oder gesetzlichen Anforderungen widerzuspiegeln. Bei Änderungen aktualisieren wir das Datum \"Zuletzt aktualisiert\" am Anfang dieser Seite."
    contact:
      title: "Kontakt"
      body: "Wenn du Fragen zu dieser Cookie-Richtlinie hast, kontaktiere uns bitte:"
