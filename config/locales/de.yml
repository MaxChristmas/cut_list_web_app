  faq:
    page_title: "FAQ - CutList"
    title: "Häufig gestellte Fragen"
    link: "FAQ"
    q1:
      question: "Wie erstelle ich eine Schnittliste?"
      answer: "Gib die Abmessungen deiner Rohplatte (Länge × Breite) im Abschnitt \"Rohplatte\" ein, füge dann die Teile hinzu, die du schneiden möchtest, mit ihren Abmessungen und Mengen. Gib deinem Projekt bei Bedarf einen Namen und klicke dann auf \"Optimieren\", um das optimale Schnittlayout zu erstellen."
    q2:
      question: "Wie funktioniert die Optimierung?"
      answer: "Der Optimierer berechnet die effizienteste Anordnung deiner Teile auf Rohplatten, um Abfall zu minimieren. Er verwendet einen fortschrittlichen Algorithmus, der Teilabmessungen, Mengen und optionale Einschränkungen wie Schnittfuge, Faserrichtung und Rotation berücksichtigt. Das Ergebnis zeigt dir, wie viele Platten du benötigst und wo jedes Teil platziert werden soll."
    q3:
      question: "Was ist eine Schnittfuge und wie stelle ich sie ein?"
      answer: "Die Schnittfuge ist die Breite des Materials, das das Sägeblatt bei jedem Schnitt entfernt. Durch Einstellung des Schnittfugenwerts (in mm) stellt der Optimierer sicher, dass dieser Materialverlust berücksichtigt wird, was zu genaueren Layouts führt. Du kannst ihn im Abschnitt Optionen einstellen."
    q4:
      question: "Wie funktioniert die Holzfaserrichtung?"
      answer: "Du kannst eine Faserrichtung auf deiner Rohplatte (entlang der Länge oder Breite) im Abschnitt Optionen festlegen. Jedes Teil kann dann angeben, welche seiner Seiten der Faser folgen soll. Dies stellt sicher, dass Teile unter Berücksichtigung des Holzfasermusters geschnitten werden, was für sichtbare Oberflächen unerlässlich ist."
    q5:
      question: "Kann ich Teile aus einer CSV-Datei importieren?"
      answer: "Ja, mit dem Worker-Plan oder höher. Klicke auf \"CSV importieren\" im Teilbereich. Deine CSV-Datei sollte Spalten für Länge, Breite und optional Menge und Bezeichnung haben. Die Teile werden deiner aktuellen Liste hinzugefügt."
    q6:
      question: "Wie exportiere ich meine Ergebnisse?"
      answer: "Du kannst dein Schnittlayout als PDF mit genauen Maßen und Teildetails über die Schaltfläche \"PDF exportieren\" exportieren. Du kannst auch Klebeetiketten passend zu Standard-Etikettenbögen (24 oder 30 Etiketten pro Seite) über die Schaltfläche \"Etiketten\" drucken. Diese Funktionen sind je nach Abonnementplan verfügbar."
    q7:
      question: "Kann ich das Schnittlayout manuell bearbeiten?"
      answer: "Ja. Klicke auf \"Layout bearbeiten\", um in den Bearbeitungsmodus zu wechseln. Du kannst Teile innerhalb einer Platte neu positionieren oder auf eine andere Platte ziehen. Die Kollisionserkennung mit Schnittfuge stellt sicher, dass sich Teile nicht überlappen. Klicke auf \"Layout speichern\", um deine Änderungen zu speichern, oder auf \"Zurücksetzen\", um zum optimierten Layout zurückzukehren."
    q8:
      question: "Was sind die Abonnementpläne?"
      answer: "CutList bietet drei Pläne an: Kostenlos (2 aktive Projekte, 10 Optimierungen pro Tag über alle Projekte, PDF-Export, Etiketten, Schnittrichtung, Schnittfuge), Worker (unbegrenzte Projekte und Optimierungen, CSV-Import, Etiketten drucken, Teile verschieben) und Enterprise (alles unbegrenzt, Rand auf Platten, Projekte archivieren). Einmaliger 3-Tage-Zugang ist ebenfalls verfügbar."
    q9:
      question: "Wie verwalte ich mein Konto?"
      answer: "Klicke auf deine E-Mail-Adresse in der Seitenleiste, um die Einstellungen aufzurufen. Du kannst dein Passwort ändern, die Sprache wechseln und dein Abonnement verwalten. Du kannst dich auch mit Google für schnellen Zugriff anmelden. Deine Projekte und Daten werden sicher gespeichert und sind von jedem Gerät aus zugänglich."
